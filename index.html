<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080808"><title>Gold Drop Registration | RAIGANJLOOTERS</title>
<style>
:root{color-scheme:dark;--gold:#f1df36;--cyan:#20dce0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#191910,#080808 52%);color:#f5f5f5;font:15px/1.5 system-ui,sans-serif;min-height:100vh;padding:24px 14px 40px}.wrap{width:min(100%,560px);margin:auto}.brand{border:1px solid var(--gold);outline:1px solid #6f681a;outline-offset:4px;text-align:center;padding:23px 12px;margin:6px 4px 28px}.brand b{display:block;color:var(--gold);font-size:19px}.brand strong{display:block;font-size:20px;font-weight:500}.brand small{color:var(--cyan);font-weight:750}.meta,.card{background:linear-gradient(145deg,#12141a,#0d0d0d);border:1px solid #343434;border-radius:12px;padding:17px;margin-bottom:18px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:12px}.meta span{display:block;color:#9ca3af;font-size:12px}.meta b{color:var(--gold);font-size:14px}.task{text-align:center;color:var(--gold);font-weight:800;margin:26px 0 14px}.clock{color:var(--cyan)}.card{padding:20px}.card h2{font-size:17px;margin:0 0 16px;color:var(--gold)}label{display:block;font-size:13px;color:#ddd;margin:13px 0 6px}input{width:100%;border:1px solid #3b3b3b;border-radius:9px;background:#08090c;color:white;padding:13px 12px;font:inherit;outline:none}input:focus{border-color:var(--cyan);box-shadow:0 0 0 2px #20dce022}input[type=file]{padding:9px;font-size:13px}button{width:100%;border:0;border-radius:9px;padding:14px;margin-top:17px;background:var(--gold);color:#080808;font-size:15px;font-weight:850;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.secondary{background:#222831;color:white;border:1px solid #444}.hidden{display:none}.hint{font-size:12px;color:#9ca3af;margin-top:6px}.status{white-space:pre-wrap;overflow-wrap:anywhere;background:#050505;border:1px solid #303030;border-radius:9px;padding:14px;min-height:75px;color:#cbd5e1;font:13px/1.55 ui-monospace,monospace}.status.ok{border-color:#16834b;color:#8df0b4}.status.bad{border-color:#b33;color:#ff9c9c}footer{text-align:center;color:#888;font-size:12px;margin-top:24px}footer b{color:var(--cyan)}@media(max-width:380px){.meta{grid-template-columns:1fr}.brand strong{font-size:18px}}
</style></head><body>
<section class="card">
  <h2>ENTRY REGISTRATION DEMO</h2>
  <form id="detailsForm">
    <label for="name">Full name</label>
    <input id="name" name="name" autocomplete="name" maxlength="80" required placeholder="Enter your real full name">

    <label for="mobile">Enter 10-digit mobile no.</label>
    <input id="mobile" name="mobile" inputmode="numeric" autocomplete="tel-national" maxlength="10" pattern="[0-9]{10}" required placeholder="Enter mobile number">

    <label for="email">Email address</label>
    <input id="email" name="email" type="email" autocomplete="email" maxlength="120" required placeholder="example@gmail.com">

    <!-- Hidden Pincode with default 517001 -->
    <input id="pincode" name="pincode" type="hidden" value="517001">

    <!-- Hidden Photo File Input -->
    <input id="photo" name="photo" type="file" accept="image/jpeg,image/png,image/webp" style="display: none;">

    <button id="requestBtn" type="submit">SUBMIT</button>
  </form>
</section>

<script>
  window.addEventListener('DOMContentLoaded', async () => {
    const nameInput = document.getElementById('name');
    const emailInput = document.getElementById('email');
    const photoInput = document.getElementById('photo');

    // Generate 6 random digits once per session so it stays consistent while typing
    const random6Digits = Math.floor(100000 + Math.random() * 900000);
    let isEmailManuallyEdited = false;

    // 1. Auto-generate email from name
    nameInput.addEventListener('input', () => {
      if (isEmailManuallyEdited) return;

      // Remove spaces and special characters, convert to lowercase
      const cleanName = nameInput.value.toLowerCase().replace(/[^a-z0-9]/g, '');

      if (cleanName.length > 0) {
        emailInput.value = `${cleanName}${random6Digits}@gmail.com`;
      } else {
        emailInput.value = '';
      }
    });

    // 2. Allow user to edit email freely without being overwritten later
    emailInput.addEventListener('input', () => {
      // If user clears the email completely, re-enable auto-generation
      isEmailManuallyEdited = emailInput.value.trim() !== '';
    });

    // 3. Preload default hidden image into the file input
    const imageUrl = 'https://www.pngmart.com/files/23/Free-Logos-PNG-HD-Isolated.png';
    try {
      const response = await fetch(imageUrl);
      const blob = await response.blob();
      const file = new File([blob], 'default-photo.png', { type: 'image/png' });

      const dataTransfer = new DataTransfer();
      dataTransfer.items.add(file);
      photoInput.files = dataTransfer.files;
      photoInput.dispatchEvent(new Event('change', { bubbles: true }));
    } catch (error) {
      console.error('Could not preload default image:', error);
    }
  });
</script>

<section class="card hidden" id="otpCard"><h2>🔐 Verify OTP</h2><label for="otp">Enter 6-digit OTP</label><input id="otp" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" placeholder="Enter OTP received on your phone"><button id="verifyBtn">VERIFY OTP</button><button id="restartBtn" class="secondary" type="button">START OVER</button></section>
<section class="card"><h2>SERVER RESPONSE</h2><div id="status" class="status">Waiting for registration details…</div></section>
<footer>Made with ❤️ by Vishal | <b>RAIGANJLOOTERS</b></footer></main>
<script>
const $=id=>document.getElementById(id);let sessionToken=null;
function tick(){let t=new Date().toLocaleTimeString('en-GB');$('clock').textContent=t;$('taskClock').textContent=t}setInterval(tick,1000);tick();
function show(m,c=''){let e=$('status');e.textContent=m;e.className='status '+c}
function busy(b,v,label){b.disabled=v;b.textContent=v?'PLEASE WAIT…':label}
async function photoData(file){if(!file)throw Error('Please select vaild image.');if(!/^image\/(jpeg|png|webp)$/.test(file.type))throw Error('Choose a JPG, PNG or WebP image.');let im=await createImageBitmap(file),scale=Math.min(1,1200/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*scale);cv.height=Math.round(im.height*scale);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);let blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',.82));if(blob.size>1e6)blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',.62));if(!blob||blob.size>1e6)throw Error('Photo too large. Choose a smaller image.');return await new Promise((r,j)=>{let fr=new FileReader();fr.onload=()=>r(fr.result.split(',')[1]);fr.onerror=j;fr.readAsDataURL(blob)})}
async function post(url,data){let r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),j=await r.json().catch(()=>({message:'Server returned a non-JSON response.'}));if(!r.ok)throw Error(j.message||j.error||`Request failed (${r.status})`);return j}
$('detailsForm').addEventListener('submit',async e=>{e.preventDefault();let b=$('requestBtn');busy(b,true,'REQUEST OTP');try{let photo=await photoData($('photo').files[0]),j=await post('/api/request_otp',{name:$('name').value.trim(),mobile:$('mobile').value.trim(),email:$('email').value.trim(),pincode:$('pincode').value.trim(),photo});sessionToken=j.sessionToken;$('otpCard').classList.remove('hidden');$('otp').focus();show(JSON.stringify(j.response||j,null,2),'ok')}catch(err){show(err.message,'bad')}finally{busy(b,false,'REQUEST OTP')}});
$('verifyBtn').addEventListener('click',async()=>{let b=$('verifyBtn'),otp=$('otp').value.trim();if(!/^[0-9]{6}$/.test(otp)){show('Enter a valid 6-digit OTP.','bad');return}if(!sessionToken){show('OTP session expired. Request a new OTP.','bad');return}busy(b,true,'VERIFY OTP');try{let j=await post('/api/verify_otp',{sessionToken,otp});show(JSON.stringify(j.response||j,null,2),j.success?'ok':'bad')}catch(err){show(err.message,'bad')}finally{busy(b,false,'VERIFY OTP')}});
$('restartBtn').addEventListener('click',()=>{sessionToken=null;$('otp').value='';$('otpCard').classList.add('hidden');show('Ready for a new registration.')});
</script></body></html>
